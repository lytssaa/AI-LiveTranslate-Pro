[DEFAULT]
# ── 百炼 Gummy-Realtime-V1 实时翻译 ──
# 获取 API Key: https://bailian.console.aliyun.com/
api_key = 你的百炼API密钥
api_url = wss://dashscope.aliyuncs.com/api-ws/v1/inference
gummy_model = gummy-realtime-v1
gummy_source_language = auto
gummy_target_language = zh
gummy_format = pcm
gummy_sample_rate = 16000
gummy_max_end_silence = 800

# ── LLM 语义分析（DeepSeek / 百炼兼容接口）──
llm_api_key = 你的LLM_API密钥
llm_api_url = https://api.deepseek.com/v1/chat/completions
llm_model = deepseek-chat

# ── 行为参数 ──
summary_interval = 60
audio_chunk_ms = 100
audio_sample_rate = 16000
audio_source = system
audio_input_device = -1
bidirectional_enabled = false
output_dir = output
